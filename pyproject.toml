[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-desk"
version = "0.4.0"
description = "Grounded Q&A over Northwind Capital Group's third-party risk and procurement policies."
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core==1.15.0",
    "agent-framework-foundry==1.11.0",
    "openai==2.54.0",
    "azure-identity==1.25.3",
    "numpy==2.5.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
